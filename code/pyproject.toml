[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "actdim"
version = "2.0.0"
description = "Delay-coordinate analysis of scalar logs from neural networks"
readme = "ReadMe.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
train = ["torch>=1.13"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["actdim*"]
